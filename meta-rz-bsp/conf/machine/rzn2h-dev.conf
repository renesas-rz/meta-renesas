#@TYPE: Machine
#@NAME: rzn2h-dev
#@DESCRIPTION: Reference machine configuration for the RZ/N2H Development Board platform

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/rz-common.inc
require conf/machine/include/rzt2h-family.inc

# Trusted Firmware-A configuration
TFA_PLATFORM ?= "n2h"
TFA_BOARD ?= "eval"

# Trusted Firmware-A configuration
PREFERRED_VERSION_trusted-firmware-a ?= "2.10%"
TFA_UBOOT ?= "1"
TFA_BUILD_TARGET ?= "bl2 fip"
BL2_BOOT_TARGET ?= "xspi0 xspi1 emmc esd"

BL2_ADJUST_VMA ?= "0x10100000"
FIP_ADJUST_VMA ?= "0x10100000"

LOADER_ADDR_xspi0	?= "0x40000200"
LOADER_ADDR_xspi1	?= "0x50000200"
LOADER_ADDR_emmc	?= "0x00000400"
LOADER_ADDR_esd	?= "0x00001000"

DEST_ADDR		?= "0x10001000"
PLL0_SSC_CTR_V		?= "0x00010000"
BOOTCPU_FLG		?= "1"
XSPI_CSSCTL_V		?= "0x07FFFFFF"

# U-Boot Configuration
UBOOT_CONFIG ??= "rzn2h-dev"
UBOOT_CONFIG[rzn2h-dev] = "rzn2h-dev_defconfig"
PREFERRED_VERSION_u-boot = "2024.07%"

# Linux kernel configuration
KERNEL_DEVICETREE ?= "renesas/r9a09g087m44-dev.dtb"
IMAGE_BOOT_FILES = " \
	bl2_bp_xspi0-${MACHINE}.bin \
	bl2_bp_xspi1-${MACHINE}.bin \
	bl2_bp_emmc-${MACHINE}.bin \
	bl2_bp_esd-${MACHINE}.bin \
	bl2_bp_xspi0-${MACHINE}.srec \
	bl2_bp_xspi1-${MACHINE}.srec \
	bl2_bp_emmc-${MACHINE}.srec \
	bl2_bp_esd-${MACHINE}.srec \
	fip-${MACHINE}.bin \
	fip-${MACHINE}.srec \
"

# Wic image
WKS_FILE = "rz-image-bootpart-esd.wks"
do_image_wic[depends] += "trusted-firmware-a:do_deploy"
