#@TYPE: Machine
#@NAME: smarc-rzg3s machine
#@DESCRIPTION: RZ/G3S SMARC EVK Board platform

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/rz-common.inc
require conf/machine/include/rzg3s-family.inc

# Machine configuration
MACHINE_FEATURES = "can alsa ext2"

SERIAL_CONSOLES ?= "115200;ttySC0"
# Trusted Firmware-A configuration
PREFERRED_VERSION_trusted-firmware-a ?= "2.10%"
TFA_PLATFORM ?= "g3s"
TFA_BOARD ?= "smarc PLAT_SYSTEM_SUSPEND=vbat"
TFA_UBOOT ?= "1"
TFA_BUILD_TARGET ?= "bl2 bl31 fip"
BL2_BOOT_TARGET ?= "spi mmc esd"

BL2_BASE_ADDR ?= "0x000A3000"
BL2_ADJUST_VMA ?= "0xA1E00"
FIP_ADJUST_VMA ?= "0x00000"
EXTRA_IMAGEDEPENDS += " firmware-pack"

# U-Boot Configuration
UBOOT_CONFIG ??= "smarc-rzg3s"
UBOOT_CONFIG[smarc-rzg3s] = "smarc-rzg3s_defconfig"
PREFERRED_VERSION_u-boot = "2024.07%"

# Supported devicetree
KERNEL_DEVICETREE ?= " \
	renesas/r9a08g045s33-smarc.dtb \
"

IMAGE_BOOT_FILES = " \
	bl2_bp_spi-${MACHINE}.bin \
	bl2_bp_mmc-${MACHINE}.bin \
	bl2_bp_esd-${MACHINE}.bin \
	fip-${MACHINE}.bin \
	bl2_bp_spi-${MACHINE}.srec \
	bl2_bp_mmc-${MACHINE}.srec \
	bl2_bp_esd-${MACHINE}.srec \
	fip-${MACHINE}.srec \
	FlashWriter-${MACHINE}.mot \
"

# Wic image
WKS_FILE = "rz-image-bootpart-esd-g3e.wks"
do_image_wic[depends] += "firmware-pack:do_deploy flash-writer:do_deploy"
